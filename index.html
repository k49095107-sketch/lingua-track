<script>
const LT_DB_NAME='lingua-track';
const LT_DB_VERSION=1;
function initStandaloneDataCore(){
 if(!('indexedDB' in window)){document.documentElement.dataset.dataCore='unavailable';return Promise.reject(new Error('IndexedDB unavailable'))}
 document.documentElement.dataset.dataCore='starting';
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(LT_DB_NAME,LT_DB_VERSION);
  req.onupgradeneeded=()=>{
   const db=req.result;
   if(!db.objectStoreNames.contains('classes')){const s=db.createObjectStore('classes',{keyPath:'id'});s.createIndex('byWorkspace','workspace',{unique:false})}
   if(!db.objectStoreNames.contains('students')){const s=db.createObjectStore('students',{keyPath:'id'});s.createIndex('byWorkspace','workspace',{unique:false});s.createIndex('byClassId','classId',{unique:false});s.createIndex('byWorkspaceClassId',['workspace','classId'],{unique:false})}
   if(!db.objectStoreNames.contains('assessments')){const s=db.createObjectStore('assessments',{keyPath:'id'});s.createIndex('byWorkspace','workspace',{unique:false});s.createIndex('byStudentId','studentId',{unique:false});s.createIndex('byClassId','classId',{unique:false});s.createIndex('byResultId','resultId',{unique:false});s.createIndex('byDate','date',{unique:false});s.createIndex('byWorkspaceStudentId',['workspace','studentId'],{unique:false});s.createIndex('byWorkspaceClassId',['workspace','classId'],{unique:false});s.createIndex('byStudentResultDate',['studentId','resultId','date'],{unique:false});s.createIndex('byClassResultDate',['classId','resultId','date'],{unique:false})}
   if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});
  };
  req.onerror=()=>{document.documentElement.dataset.dataCore='unavailable';reject(req.error||new Error('IndexedDB open failed'))};
  req.onsuccess=()=>{
   const db=req.result; const now=new Date().toISOString();
   const tx=db.transaction(['meta'],'readwrite'); const store=tx.objectStore('meta');
   store.put({key:'dbSchemaVersion',value:1,updatedAt:now});
   store.put({key:'curriculumCatalogVersion',value:'2026.08.1',updatedAt:now});
   store.put({key:'evaluationEngineVersion',value:'1.0.0',updatedAt:now});
   const getInit=store.get('initializedAt');
   getInit.onsuccess=()=>{if(!getInit.result)store.put({key:'initializedAt',value:now,updatedAt:now})};
   tx.oncomplete=()=>{document.documentElement.dataset.dataCore='ready';resolve(db)};
   tx.onerror=()=>{document.documentElement.dataset.dataCore='unavailable';reject(tx.error||new Error('IndexedDB meta init failed'))};
  };
 });
}
window.__linguaTrackDataCoreReady=initStandaloneDataCore().catch(err=>{console.error('LINGUA TRACK data core initialization failed',err);return null});

function createStep2Template(){return `<div class="classesPage"><div class="clsHeader"><div><div class="clsEyebrow">КЛАССЫ</div><h1>Создать класс</h1><p>Добавьте учеников сейчас или сделайте это позже.</p></div><button class="clsText" id="clsClose">Закрыть</button></div><div class="clsStepper"><div class="clsStep done"><span>1</span><b>Параметры класса</b></div><i></i><div class="clsStep active"><span>2</span><b>Ученики</b></div></div>${cls.error?`<div class="clsError">${esc(cls.error)}</div>`:''}<div class="clsForm"><div class="clsSummary"><div><b>${esc(cls.name)}</b><span>${cls.grade} класс · ${cls.year}/${String(cls.year+1).slice(-2)}${cls.grade>=10?` · ${levelLabel(cls.level)}`:''}</span></div><button class="clsText" id="clsBackEdit">Изменить</button></div><div class="clsStudentCols"><label class="clsField"><span>Добавить списком</span><textarea id="clsBulk" placeholder="По одному ученику на строке&#10;Анна П.&#10;Максим К.&#10;София Л.">${esc(cls.bulk)}</textarea><button class="clsSecondary" id="clsBulkAdd" type="button">Добавить из списка</button></label><div class="clsField"><span>Добавить одного ученика</span><div class="clsInlineAdd"><input id="clsSingle" value="${esc(cls.single)}" placeholder="Имя ученика"><button id="clsSingleAdd" aria-label="Добавить ученика">+</button></div><small>Можно использовать инициалы или псевдонимы на общем компьютере.</small></div></div><div class="clsPreview"><div class="clsPreviewHead"><b>Ученики</b><span class="clsCount">${cls.names.length}</span></div>${cls.names.length?`<div class="clsNameChips">${cls.names.map((n,i)=>`<span>${esc(n)}<button data-remove-name="${i}" aria-label="Удалить ${esc(n)}">×</button></span>`).join('')}</div>`:'<p>Можно создать класс без учеников и добавить их позже.</p>'}</div><div class="clsFormActions"><button class="clsSecondary" id="clsBack">Назад</button><button class="clsPrimary" id="clsFinish">Создать класс</button></div></div></div>`}
function manageTemplate(){const c=cls.active;const locked=!!c.profileLockedAt;const yearOptions=[c.schoolYear.startYear,schoolYearStart()-1,schoolYearStart(),schoolYearStart()+1,schoolYearStart()+2].filter((v,i,a)=>a.indexOf(v)===i).sort();return `<div class="classesPage"><div class="clsBread"><button id="clsBread">Классы</button><span>›</span><b>${esc(c.name)}</b></div><div class="clsHeader"><div><div class="clsEyebrow">КЛАСС</div><h1>${esc(c.name)}</h1><p>${c.grade} класс · ${formatYear(c)}${c.programLevel?` · ${levelLabel(c.programLevel)}`:''}</p></div>${locked?'<span class="clsLocked">Профиль зафиксирован после первого оценивания</span>':''}</div>${cls.error?`<div class="clsError">${esc(cls.error)}</div>`:''}<div class="clsManage"><article class="clsForm"><h2>Настройки класса</h2><label class="clsField"><span>Название</span><input id="clsEditName" value="${esc(cls.editName)}"></label>${locked?`<div class="clsReadOnly"><div><span>Класс обучения</span><b>${c.grade}</b></div><div><span>Учебный год</span><b>${formatYear(c)}</b></div>${c.programLevel?`<div><span>Уровень</span><b>${c.programLevel==='advanced'?'Углублённый':'Базовый'}</b></div>`:''}</div><p class="clsNote">Класс обучения, учебный год и уровень программы нельзя менять после первого оценивания. Для нового учебного года создайте новый класс.</p>`:`<div class="clsEditProfile"><label class="clsField"><span>Класс обучения</span><select id="clsEditGrade">${grades.map(g=>`<option value="${g}" ${cls.editGrade===g?'selected':''}>${g} класс</option>`).join('')}</select></label><label class="clsField"><span>Учебный год</span><select id="clsEditYear">${yearOptions.map(y=>`<option value="${y}" ${cls.editYear===y?'selected':''}>${y}/${String(y+1).slice(-2)}</option>`).join('')}</select></label>${cls.editGrade>=10?`<div class="clsField clsFull"><span>Уровень программы</span><div class="clsSegments"><button data-edit-level="basic" class="${cls.editLevel==='basic'?'active':''}">Базовый</button><button data-edit-level="advanced" class="${cls.editLevel==='advanced'?'active':''}">Углублённый</button></div></div>`:''}</div>`}<div class="clsFormActions"><button class="clsPrimary" id="clsSaveName" ${!cls.editName.trim()?'disabled':''}>Сохранить изменения</button></div></article><article class="clsForm"><h2>Ученики <span class="clsCount">${cls.students.length}</span></h2><div class="clsInlineAdd"><input id="clsNewStudent" value="${esc(cls.newStudent)}" placeholder="Добавить ученика"><button id="clsAddStudent">+</button></div><div class="clsList">${cls.students.length?cls.students.map((st,i)=>`<div class="clsStudentRow">${cls.editingStudent===i?`<input class="clsStudentEdit" id="clsStudentEditInput" value="${esc(cls.editingStudentName)}"><div class="clsStudentActions"><button data-save-student="${i}">Сохранить</button><button data-cancel-student="${i}">Отмена</button></div>`:`<span>${esc(st.displayName)}</span><div class="clsStudentActions"><button data-profile-student="${i}">Профиль</button><button data-edit-student="${i}">Изменить</button><button class="remove" data-remove-student="${i}">Удалить</button></div>`}</div>`).join(''):'<p>Пока нет учеников.</p>'}</div></article></div><div class="clsManageFooter"><button class="clsSecondary" id="clsListBack">К списку классов</button></div></div>`}

function discardOk(){return !hasUnsaved()||confirm('Есть несохранённые изменения. Закрыть их без сохранения?')}
function resetCreate(){cls.mode='create';cls.step=1;clearDirty();cls.error='';cls.name='';cls.grade=6;cls.year=schoolYearStart();cls.level='basic';cls.bulk='';cls.single='';cls.names=[]}
async function renderClasses(){view.className='';view.innerHTML='<div class="classesPage"><div class="clsLoading">Загружаем классы…</div></div>';try{await ensureStandaloneDemo();if(cls.mode==='create'){view.innerHTML=cls.step===1?createStep1Template():createStep2Template();bindCreate();return}if(cls.mode==='manage'&&cls.active){view.innerHTML=manageTemplate();bindManage();return}const classes=await listUserClasses();const summaries=await Promise.all(classes.map(async record=>({record,studentCount:(await listStudents(record.id)).length,assessmentCount:(await listAssessmentsClass(record.id)).length})));view.innerHTML=classListTemplate(summaries);document.getElementById('clsCreate')?.addEventListener('click',()=>{resetCreate();renderClasses()});document.getElementById('clsFirst')?.addEventListener('click',()=>{resetCreate();renderClasses()});document.getElementById('clsDemo')?.addEventListener('click',()=>{setSelectedClass('class_demo_6a_2025','6А');safeNavigate('home')});document.querySelectorAll('[data-open-class]').forEach(b=>b.addEventListener('click',()=>openStandaloneClass(summaries[Number(b.dataset.openClass)].record)));document.querySelectorAll('[data-delete-class]').forEach(b=>b.addEventListener('click',()=>deleteClassStandalone(summaries[Number(b.dataset.deleteClass)])))}catch(e){view.innerHTML=`<div class="classesPage"><div class="clsError">${esc(e.message||'Не удалось загрузить классы')}</div></div>`}}
function bindCreate(){const close=()=>{if(discardOk()){cls.mode='list';clearDirty();renderClasses()}};document.getElementById('clsClose')?.addEventListener('click',close);document.getElementById('clsCancel')?.addEventListener('click',close);const name=document.getElementById('clsName');name?.addEventListener('input',e=>{cls.name=e.target.value;cls.dirtyCreate=true});document.getElementById('clsYear')?.addEventListener('change',e=>{cls.year=Number(e.target.value);cls.dirtyCreate=true});document.querySelectorAll('[data-grade]').forEach(b=>b.addEventListener('click',()=>{cls.grade=Number(b.dataset.grade);cls.dirtyCreate=true;renderClasses()}));document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{cls.level=b.dataset.level;cls.dirtyCreate=true;renderClasses()}));document.getElementById('clsNext')?.addEventListener('click',()=>{if(!cls.name.trim()){cls.error='Введите название класса.';renderClasses();return}cls.error='';cls.step=2;renderClasses()});document.getElementById('clsBack')?.addEventListener('click',()=>{cls.step=1;renderClasses()});document.getElementById('clsBackEdit')?.addEventListener('click',()=>{cls.step=1;renderClasses()});const bulk=document.getElementById('clsBulk');bulk?.addEventListener('input',e=>{cls.bulk=e.target.value;cls.dirtyCreate=true});const single=document.getElementById('clsSingle');single?.addEventListener('input',e=>{cls.single=e.target.value;cls.dirtyCreate=true});single?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSingleDraft()}});document.getElementById('clsBulkAdd')?.addEventListener('click',()=>{cls.names=normalizeNames([...cls.names,...cls.bulk.split(/\r?\n|;/)]);cls.bulk='';cls.dirtyCreate=true;renderClasses()});document.getElementById('clsSingleAdd')?.addEventListener('click',addSingleDraft);document.querySelectorAll('[data-remove-name]').forEach(b=>b.addEventListener('click',()=>{cls.names=cls.names.filter((_,i)=>i!==Number(b.dataset.removeName));cls.dirtyCreate=true;renderClasses()}));document.getElementById('clsFinish')?.addEventListener('click',finishCreate)}
function addSingleDraft(){if(!cls.single.trim())return;cls.names=normalizeNames([...cls.names,cls.single]);cls.single='';cls.dirtyCreate=true;renderClasses()}
async function finishCreate(){if(!cls.name.trim()){cls.step=1;cls.error='Введите название класса.';renderClasses();return}const now=new Date().toISOString(),classId=id('class');const c={id:classId,workspace:'user',name:cls.name.trim(),grade:cls.grade,schoolYear:{startYear:cls.year,endYear:cls.year+1},createdAt:now,updatedAt:now};if(cls.grade>=10)c.programLevel=cls.level;const students=cls.names.map(displayName=>({id:id('student'),workspace:'user',classId,displayName,createdAt:now,updatedAt:now}));try{await createClassTx(c,students);clearDirty();cls.mode='list';cls.error='';setSelectedClass(classId,c.name);renderClasses()}catch(e){cls.error=e.message||'Не удалось создать класс';renderClasses()}}
async function openStandaloneClass(c){try{cls.active=await getById('classes',c.id)||c;cls.students=await listStudents(c.id);cls.editName=cls.active.name;cls.editGrade=cls.active.grade;cls.editYear=cls.active.schoolYear.startYear;cls.editLevel=cls.active.programLevel||'basic';cls.editingStudent=-1;cls.editingStudentName='';cls.newStudent='';cls.mode='manage';clearDirty();cls.error='';setSelectedClass(cls.active.id,cls.active.name);renderClasses()}catch(e){cls.error=e.message||'Не удалось открыть класс';cls.mode='list';renderClasses()}}
function beginStandaloneStudentEdit(index){if(index<0||index>=cls.students.length)return;if(cls.editingStudent!==-1&&cls.editingStudent!==index&&cls.dirtyStudent){if(!confirm('Есть несохранённые изменения имени ученика. Отменить их?'))return}cls.editingStudent=index;cls.editingStudentName=cls.students[index].displayName;cls.dirtyStudent=false;renderClasses()}
function bindManage(){const back=()=>{if(discardOk()){cls.mode='list';clearDirty();renderClasses()}};document.getElementById('clsBread')?.addEventListener('click',back);document.getElementById('clsListBack')?.addEventListener('click',back);document.getElementById('clsEditName')?.addEventListener('input',e=>{cls.editName=e.target.value;cls.dirtyClass=true;const btn=document.getElementById('clsSaveName');if(btn)btn.disabled=!cls.editName.trim()});document.getElementById('clsEditGrade')?.addEventListener('change',e=>{cls.editGrade=Number(e.target.value);cls.dirtyClass=true;renderClasses()});document.getElementById('clsEditYear')?.addEventListener('change',e=>{cls.editYear=Number(e.target.value);cls.dirtyClass=true});document.querySelectorAll('[data-edit-level]').forEach(b=>b.addEventListener('click',()=>{cls.editLevel=b.dataset.editLevel;cls.dirtyClass=true;renderClasses()}));document.getElementById('clsSaveName')?.addEventListener('click',async()=>{if(!cls.editName.trim())return;try{const u={...cls.active,name:cls.editName.trim(),updatedAt:new Date().toISOString()};if(!cls.active.profileLockedAt){u.grade=cls.editGrade;u.schoolYear={startYear:cls.editYear,endYear:cls.editYear+1};if(cls.editGrade>=10)u.programLevel=cls.editLevel;else delete u.programLevel}await saveClassStandalone(u);cls.active=await getById('classes',u.id)||u;cls.editName=cls.active.name;cls.editGrade=cls.active.grade;cls.editYear=cls.active.schoolYear.startYear;cls.editLevel=cls.active.programLevel||'basic';cls.dirtyClass=false;if(selectedClassId()===cls.active.id)setSelectedClass(cls.active.id,cls.active.name);cls.error='';renderClasses()}catch(e){cls.error=e.message||'Не удалось сохранить класс';renderClasses()}});const input=document.getElementById('clsNewStudent');input?.addEventListener('input',e=>{cls.newStudent=e.target.value;cls.dirtyNewStudent=true});input?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addStandaloneStudent()}});document.getElementById('clsAddStudent')?.addEventListener('click',addStandaloneStudent);document.querySelectorAll('[data-profile-student]').forEach(b=>b.addEventListener('click',()=>safeNavigate(`students/${encodeURIComponent(cls.students[Number(b.dataset.profileStudent)].id)}`)));document.querySelectorAll('[data-edit-student]').forEach(b=>b.addEventListener('click',()=>beginStandaloneStudentEdit(Number(b.dataset.editStudent))));document.getElementById('clsStudentEditInput')?.addEventListener('input',e=>{cls.editingStudentName=e.target.value;cls.dirtyStudent=true});document.getElementById('clsStudentEditInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveStandaloneStudentName(cls.editingStudent)}if(e.key==='Escape'){cls.editingStudent=-1;cls.editingStudentName='';cls.dirtyStudent=false;renderClasses()}});document.querySelectorAll('[data-save-student]').forEach(b=>b.addEventListener('click',()=>saveStandaloneStudentName(Number(b.dataset.saveStudent))));document.querySelectorAll('[data-cancel-student]').forEach(b=>b.addEventListener('click',()=>{cls.editingStudent=-1;cls.editingStudentName='';cls.dirtyStudent=false;renderClasses()}));document.querySelectorAll('[data-remove-student]').forEach(b=>b.addEventListener('click',()=>deleteStudentStandalone(cls.students[Number(b.dataset.removeStudent)])))}
async function saveStandaloneStudentName(index){const st=cls.students[index],name=cls.editingStudentName.trim().replace(/\s+/g,' ');if(!st||!name)return;try{await saveStudentStandalone({...st,displayName:name,updatedAt:new Date().toISOString()});cls.students=await listStudents(cls.active.id);cls.editingStudent=-1;cls.editingStudentName='';cls.dirtyStudent=false;cls.error='';renderClasses()}catch(e){cls.error=e.message||'Не удалось переименовать ученика';renderClasses()}}

async function addStandaloneStudent(){if(!cls.active||!cls.newStudent.trim())return;const now=new Date().toISOString();const s={id:id('student'),workspace:'user',classId:cls.active.id,displayName:cls.newStudent.trim().replace(/\s+/g,' '),createdAt:now,updatedAt:now};try{await saveStudentStandalone(s);cls.students=await listStudents(cls.active.id);cls.newStudent='';cls.dirtyNewStudent=false;cls.error='';renderClasses()}catch(e){cls.error=e.message||'Не удалось добавить ученика';renderClasses()}}

function validateStandaloneAssessmentAgainstCurriculum(row,c){if(row.curriculumCatalogVersion!=='2026.08.1')return;const p=standaloneProfile(c),r=p?.results?.find(x=>x.id===row.resultId);if(!r)throw new Error('Предметный результат отсутствует в профиле класса.');if(row.areaId!==r.areaId)throw new Error('Область не соответствует предметному результату.');if(row.evaluationModel!==r.evaluationModel)throw new Error('Модель оценки не соответствует предметному результату.');if(!row.taskTypeId||!(r.taskTypes||[]).some(x=>x.id===row.taskTypeId))throw new Error('Формат задания не относится к предметному результату.');if(!['support-needed','forming','achieved','confident'].includes(row.finalStatus)||row.recommendedStatus&&!['support-needed','forming','achieved','confident'].includes(row.recommendedStatus))throw new Error('Запись содержит недопустимый статус оценивания.');if(!row.evidence||row.evidence.model!==r.evaluationModel)throw new Error('Evidence не соответствует модели оценки.');if(r.evaluationModel==='rubric'){const expected=(r.criteria||[]).map(x=>x.id),actual=(row.evidence.criteria||[]).map(x=>x.criterionId);if(actual.length!==expected.length||actual.some(x=>!expected.includes(x))||expected.some(x=>!actual.includes(x)))throw new Error('Критерии не соответствуют предметному результату.');if(!(row.evidence.criteria||[]).some(x=>x.state!=='not-counted'))throw new Error('Критериальная запись не содержит ни одного учитываемого критерия.')}if(r.evaluationModel==='score'){if((row.evidence.scoreRuleId||undefined)!==(r.scoreRuleId||undefined))throw new Error('Правило балльной оценки не соответствует предметному результату.');const points=row.evidence.points,maxPoints=row.evidence.maxPoints;if(typeof points!=='number'||!Number.isFinite(points)||typeof maxPoints!=='number'||!Number.isFinite(maxPoints)||points<0||maxPoints<=0||points>maxPoints)throw new Error('Балльная запись должна содержать корректные points и maxPoints.')}}

function standaloneRecommend(){const r=assessResult();if(!r)return null;if(r.model==='score'){const p=Number(assess.points),m=Number(assess.maxPoints);if(!assess.points||!assess.maxPoints||!Number.isFinite(p)||!Number.isFinite(m)||m<=0||p<0||p>m)return null;const x=p/m;return x<.4?'support-needed':x<.65?'forming':x<.85?'achieved':'confident'}if(r.model==='observation')return assess.observation||null;const counted=(r.criteria||[]).map(c=>({c,state:assess.rubric[c.id]})).filter(x=>x.state&&x.state!=='not-counted');if(counted.length<2)return null;const w={'support-needed':1,forming:2,achieved:3,confident:4};const avg=counted.reduce((a,x)=>a+w[x.state],0)/counted.length;let st=avg<1.75?'support-needed':avg<2.75?'forming':avg<3.65?'achieved':'confident';if(counted.some(x=>x.c.critical&&(x.state==='support-needed'||x.state==='forming'))&&(st==='achieved'||st==='confident'))st='forming';return st}

async function renderAssess(contextParams){view.className='';try{const hasContext=!!contextParams&&(contextParams.has('studentId')||contextParams.has('resultId')||contextParams.has('returnTo'));if(hasContext){const selected=await resolveStandaloneSelectedClass();if(!selected){view.innerHTML=placeholder('Сначала выберите класс');return}resetAssessment();assess.record=selected;assess.students=await listStudents(selected.id,selected.workspace);assess.date=todayStandalone();assess.hasRequestedReturnTo=contextParams.has('returnTo');assess.resolvedReturnTo=resolveStandaloneAssessmentReturnTo(contextParams.get('returnTo'));const requestedStudentId=contextParams.get('studentId')||'',requestedResultId=contextParams.get('resultId')||'',student=assess.students.find(x=>x.id===requestedStudentId);let contextError='';if(requestedStudentId){if(student){assess.studentId=student.id;assess.step=2}else{assess.studentId='';assess.step=1;contextError='Переданный ученик не относится к выбранному классу. Выберите ученика вручную.'}}else{assess.step=1;if(!requestedResultId&&!assess.hasRequestedReturnTo&&assess.students.length===1)assess.studentId=assess.students[0].id}if(requestedResultId){if(!requestedStudentId||contextError){assess.blockDefaultResult=true;assess.resultQueryMessage='Для предварительного выбора результата сначала должен быть определён ученик.';assess.resultId='';assess.taskId='';clearStandaloneEvidenceForResult(null)}else{const rr=standaloneResults(selected).find(x=>x.id===requestedResultId);if(rr){assess.area=rr.area;assess.resultId=rr.id;assess.taskId=rr.tasks?.[0]?.[0]||'';clearStandaloneEvidenceForResult(rr)}else{assess.blockDefaultResult=true;assess.resultQueryMessage='Переданный предметный результат недоступен для образовательного профиля этого класса.';assess.area=standaloneAreas(selected)[0]?.[0]||'';assess.resultId='';assess.taskId='';clearStandaloneEvidenceForResult(null)}}}else ensureAssessmentResult();if(contextError)assess.error=contextError;assess.dirty=false function resetBatch(){batch.step=1;batch.dirty=false;batch.error='';batch.resolvedReturnTo='home';batch.hasRequestedReturnTo=false;batch.record=null;batch.students=[];batch.type='current';batch.area='speaking';batch.resultId='';batch.taskId='';batch.topic='';batch.date=todayStandalone();batch.maxPoints='';batch.rows={};batch.saved=null}

function batchResult(){return standaloneResults(batch.record).find(x=>x.id===batch.resultId)}

function batchTable(){const r=batchResult();const active=batch.students.filter(st=>!batchRow(st.id).skip),ready=active.filter(st=>batchRowReady(st.id)).length,skipped=batch.students.length-active.length;let heads='';if(r.model==='rubric')heads='<th>Критерии</th><th>Рекомендация</th><th>Итоговый статус</th><th>Отметка</th>';else if(r.model==='score')heads='<th>Баллы</th><th>Рекомендация</th><th>Итоговый статус</th><th>Отметка</th>';else heads='<th>Наблюдение</th><th>Итоговый статус</th><th>Комментарий</th>';const body=batch.students.map(st=>{const row=batchRow(st.id),rec=batchRecommend(st.id),complete=batchRowReady(st.id);let cells='';if(r.model==='rubric'){cells=`<td class="batchCriteria">${(r.criteria||[]).map(c=>`<div class="batchCriterion"><div title="${esc(c.label)}"><b>${esc(c.label)}</b>${c.critical?'<i>ключевой</i>':''}</div><div>${criterionStates.map((state,i)=>`<button ${row.skip?'disabled':''} class="c${i} ${row.rubric[c.id]===state?'on':''}" data-batch-criterion="${c.id}" data-student="${st.id}" data-state="${state}" title="${criterionLabels[state]}">${i===0?'—':i===1?'!':i===2?'◐':i===3?'✓':'★'}</button>`).join('')}</div></div>`).join('')}</td><td class="batchRec">${rec?`<b>${statusLabels[rec]}</b><button data-batch-apply="${st.id}" ${row.skip?'disabled':''}>Применить</button>`:'—'}</td><td><select data-batch-final="${st.id}" ${row.skip?'disabled':''}>${batchStatusOptions(row.finalStatus)}</select></td><td><select data-batch-mark="${st.id}" ${row.skip?'disabled':''}>${batchMarkOptions(row.mark)}</select></td>`}else if(r.model==='score'){cells=`<td><div class="batchScore"><input data-batch-points="${st.id}" ${row.skip?'disabled':''} type="number" min="0" max="${esc(batch.maxPoints)}" value="${esc(row.points)}"><span>из ${esc(batch.maxPoints)}</span></div></td><td class="batchRec">${rec?`<b>${statusLabels[rec]}</b><button data-batch-apply="${st.id}" ${row.skip?'disabled':''}>Применить</button>`:'—'}</td><td><select data-batch-final="${st.id}" ${row.skip?'d async function saveStandaloneBatch(){const r=batchResult();if(!r)return;const active=batch.students.filter(st=>!batchRow(st.id).skip);if(!active.length){batch.error='Отметьте хотя бы одного ученика для оценивания.';renderBatch();return}const incomplete=active.filter(st=>!batchRowReady(st.id));if(incomplete.length){batch.error=`Не завершена оценка: ${incomplete.slice(0,3).map(x=>x.displayName).join(', ')}${incomplete.length>3?` и ещё ${incomplete.length-3}`:''}.`;renderBatch();return}const now=new Date().toISOString();const records=active.map(st=>{const row=batchRow(st.id),rec=batchRecommend(st.id);let evidence;if(r.model==='rubric')evidence={model:'rubric',criteria:(r.criteria||[]).map(c=>({criterionId:c.id,state:row.rubric[c.id]||'not-counted'}))};else if(r.model==='score')evidence={model:'score',scoreRuleId:r.rule,points:Number(row.points),maxPoints:Number(batch.maxPoints)};else evidence={model:'observation',observation:row.observation};return {id:id('assessment'),workspace:batch.record.workspace,classId:batch.record.id,studentId:st.id,date:batch.date,assessmentType:batch.type,areaId:r.area,resultId:r.id,taskTypeId:batch.taskId||undefined,topic:batch.topic.trim()||undefined,evaluationModel:r.model,evidence,recommendedStatus:rec||undefined,finalStatus:row.finalStatus,schoolMark:r.model==='observation'?undefined:(row.mark||undefined),comment:r.model==='observation'?(row.comment.trim()||undefined):undefined,curriculumCatalogVersion:'2026.08.1',evaluationEngineVersion:'1.0.0',createdAt:now,updatedAt:now}});try{for(const row of records)validateStandaloneAssessmentAgainstCurriculum(row,batch.record);const db=await dbReady();const tx=db.transaction(['classes','students','assessments'],'readwrite'),cstore=tx.objectStore('classes'),sstore=tx.objectStore('students'),astore=tx.objectStore('assessments');let c=await reqP(cstore.get(batch.record.id));if(!c||c.workspace!==batch.record.workspace)throw new Error('Выбранный класс не найден.');const checked=[];for(const row of records){const st=await reqP(sstore.get(row.studentId));if(!st||st.classId!==row.classId||st.workspace!==row.workspace)throw new Error('Ученик не относится к выбранному классу.');const existing=await reqP(astore.get(row.id));if(existing&&existing.workspace!==row.workspace)throw new Error('ID оценивания используется в другом пространстве данных.');checked.push(row)}checked.forEach(row=>astore.put(row));if(!c.profileLockedAt){c={...c,profileLockedAt:now,updatedAt:now};cstore.put(c)}await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Не удалось сохранить массовое оценивание'))});batch.record=c;batch.dirty=false;batch.saved={count:records.length,skipped:batch.students.length-records.length,result:r.short};batch.step='saved';batch.error='';renderBatch()}catch(e){batch.error=e.message||'Не удалось сохранить массовое оценивание';renderBatch()}}

const sp={tab:'overview',student:null,record:null,assessments:[],selectedResult:'',progressResult:'',areaFilter:'',resultFilter:'',typeFilter:'',statusFilter:'',edit:null,dirty:false,error:''};
const spStatusLabels={'not-assessed':'Не оценивалось','support-needed':'Нужна поддержка',forming:'Формируется',achieved:'Достигнут',confident:'Уверенное владение'};
const spRank={'support-needed':1,forming:2,achieved:3,confident:4};
function clearProfileDirty(){sp.dirty=false;sp.edit=null}
function spSort(records,oldest=false){const a=sortStandaloneAssessmentsNewestFirst(records);return oldest?a.reverse():a}
function spFormatDate(value){if(!value)return '—';const [y,m,d]=String(value).split('-').map(Number);if(!y||!m||!d)return value;return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(y,m-1,d))}

function spAreaDefs(c){return (standaloneProfile(c)?.areas||[]).map(a=>({id:a.id,label:a.label,short:a.shortLabel}))}
function spHistory(resultId){return spSort(sp.assessments.filter(a=>a.resultId===resultId))}
function spSnapshot(c,result){const h=spHistory(result.id),last=h[0],prev=h[1];let dynamics='not-assessed';if(last&&!prev)dynamics='first';else if(last&&prev)dynamics=spRank[last.finalStatus]>spRank[prev.finalStatus]?'up':spRank[last.finalStatus]<spRank[prev.finalStatus]?'down':'stable';return {result,status:last?.finalStatus||'not-assessed',confirmations:h.length,last,prev,dynamics}}
function spAreas(c){return spAreaDefs(c).map(area=>{const results=standaloneResults(c).filter(r=>r.area===area.id).map(r=>spSnapshot(c,r));return {area,results,assessed:results.filter(x=>x.status!=='not-assessed').length,total:results.length}})}
function spSummary(c){const results=standaloneResults(c).map(r=>spSnapshot(c,r));return {records:sp.assessments.length,assessed:results.filter(x=>x.status!=='not-assessed').length,total:results.length,strong:results.filter(x=>x.status==='achieved'||x.status==='confident').length,forming:results.filter(x=>x.status==='forming').length,support:results.filter(x=>x.status==='support-needed').length,unassessed:results.filter(x=>x.status==='not-assessed').length}}

function spAreaStatusSummary(results){const order=['support-needed','forming','achieved','confident','not-assessed'];const counts=Object.fromEntries(order.map(x=>[x,0]));results.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);return `<div class="spAreaStatuses">${order.filter(x=>counts[x]).map(x=>`<span class="spAreaStatusItem">${spStatus(x)}<b>${counts[x]}</b></span>`).join('')}</div>`}
function spDynamics(value){const label=value==='up'?'Рост':value==='down'?'Снижение':value==='stable'?'Без изменений':value==='first'?'Первая запись':'Нет данных';const symbol=value==='up'?'↑':value==='down'?'↓':value==='stable'?'→':value==='first'?'●':'○';return `<span class="spDyn ${value}">${symbol} ${label}</span>`}
function spConfirmations(n){const m10=n%10,m100=n%100,word=m10===1&&m100!==11?'подтверждение':m10>=2&&m10<=4&&(m100<12||m100>14)?'подтверждения':'подтверждений';return `${n} ${word}`}

function spProgressTemplate(){const c=sp.record,ids=spCurrentResultIds(c);if(!ids.length)return '<div class="spEmpty"><h2>Динамика появится после оцениваний</h2><p>Для построения прогресса нужна хотя бы одна запись по предметному результату.</p></div>';if(!ids.includes(sp.progressResult))sp.progressResult=ids[0];const r=spResult(c,sp.progressResult),history=spSort(sp.assessments.filter(a=>a.resultId===sp.progressResult),true),newest=spSort(history),last=newest[0],prev=newest[1],dyn=!last?'not-assessed':!prev?'first':spRank[last.finalStatus]>spRank[prev.finalStatus]?'up':spRank[last.finalStatus]<spRank[prev.finalStatus]?'down':'stable';const choices=ids.map(idv=>{const rr=spResult(c,idv),h=spHistory(idv);return `<button class="${sp.progressResult===idv?'on':''}" data-sp-progress="${idv}"><div><b>${esc(rr?.short||idv)}</b><small>${spConfirmations(h.length)}</small></div>${spStatus(h[0]?.finalStatus||'not-assessed')}</button>`}).join('');const timeline=history.map((a,i)=>`<div class="spTimelineItem"><div class="spRail"><i></i><span></span></div><div class="spEntry"><div class="spEntryHead"><div><b>${spFormatDate(a.date)}</b><br><small>Запись ${i+1} из ${history.length}</small></div>${spStatus(a.finalStatus)}</div><p>${esc(a.topic||(a.assessmentType==='current'?'Текущее':'Тематическое'))}${a.schoolMark?` · отметка ${a.schoolMark}`:''}</p>${a.comment?`<small>${esc(a.comment)}</small>`:''}</div></div>`).join('');return `<div class="spProgress"><aside class="spProgressPicker"><div class="spEyebrow">РЕЗУЛЬТАТ</div><h2>Выберите линию прогресса</h2><div class="spProgressList">${choices}</div></aside><article class="spTimeline"><div class="spTimelineHead"><div><div class="spEyebrow">ДИНАМИКА РЕЗУЛЬТАТА</div><h2>${esc(r?.label||'')}</h2><small>${esc(r?.benchmark||r?.desc||'')}</small></div>${spDynamics(dyn)}</div>${timeline}</article></div>`}
